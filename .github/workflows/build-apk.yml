name: Build APK

# Ročno sproženo (gumb "Run workflow" v zavihku Actions) ali ob vsakem push-u
# na glavno vejo. Gradi na GitHub-ovih strežnikih (imajo že nameščen Android
# SDK/Java), zato ti ni treba ničesar nameščati na svoj računalnik.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

# issues:write - da lahko ob napaki gradnje objavimo dnevnik kot GitHub issue
#   (Actions dnevniki/artefakti so sicer na Azure blob storage, ki ni vedno
#   dosegljiv iz vsakega omrežja/orodja - issue objava gre prek navadnega
#   GitHub API, zato je zanesljivejša za avtomatsko diagnostiko).
# contents:write - za objavo .apk kot GitHub Release priponko ob uspehu.
permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (opozorilno, ne prekine gradnje)
        run: flutter analyze || true

      - name: Build APK (release)
        shell: bash
        run: |
          set +e
          flutter build apk --release --verbose 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Report failure as GitHub issue (log tail)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 60000 build.log > build_tail.log
          gh issue create \
            --title "Build failure: run ${{ github.run_id }}" \
            --body-file build_tail.log

      - name: Upload APK as build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sentryscan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish APK as GitHub Release asset
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "SentryScan build ${{ github.run_number }}" \
            --notes "Samodejno zgrajen APK iz commita ${{ github.sha }}"
