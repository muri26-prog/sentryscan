name: Build APK

# Ročno sproženo (gumb "Run workflow" v zavihku Actions) ali ob vsakem push-u
# na glavno vejo. Gradi na GitHub-ovih strežnikih (imajo že nameščen Android
# SDK/Java), zato ti ni treba ničesar nameščati na svoj računalnik.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (opozorilno, ne prekine gradnje)
        run: flutter analyze || true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentryscan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
